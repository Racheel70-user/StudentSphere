<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript - Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0b1120; color: #eef2f6; font-family: 'Poppins', sans-serif; min-height: 100vh; padding: 30px; }
        .notes-container { max-width: 1000px; margin: 0 auto; }
        .back-btn { display: inline-flex; align-items: center; gap: 10px; color: #38bdf8; font-weight: 500; font-size: 0.95rem; cursor: pointer; background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.15); padding: 10px 22px; border-radius: 30px; transition: 0.3s; margin-bottom: 24px; }
        .back-btn:hover { background: rgba(56,189,248,0.15); border-color: #38bdf8; transform: translateX(-4px); }
        .notes-header { display: flex; align-items: center; gap: 20px; padding: 24px 28px; background: rgba(22,34,54,0.7); border-radius: 20px; border: 1px solid #1e2e47; margin-bottom: 28px; backdrop-filter: blur(10px); }
        .notes-header .icon { font-size: 3.5rem; line-height: 1; }
        .notes-header h1 { font-size: 2rem; font-weight: 700; color: #f0f9ff; }
        .notes-header .subtitle { color: #94a3b8; font-size: 0.95rem; }
        .progress-section { background: rgba(22,34,54,0.6); border-radius: 16px; padding: 22px 26px; margin-bottom: 28px; border: 1px solid #1e2e47; }
        .progress-top { display: flex; justify-content: space-between; color: #94a3b8; font-size: 14px; }
        .progress-top i { margin-right: 6px; }
        .progress-bar { width: 100%; height: 8px; background: #2a3650; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #38bdf8, #4ade80); border-radius: 10px; transition: width 0.5s ease; }
        .progress-text { display: flex; justify-content: space-between; color: #94a3b8; font-size: 14px; margin-top: 6px; }
        .chapters-title { color: #f0f9ff; font-size: 20px; font-weight: 600; margin-bottom: 18px; }
        .chapters-title i { color: #38bdf8; margin-right: 10px; }
        .chapter-item { background: rgba(22,34,54,0.5); border: 1px solid #1e2e47; border-radius: 14px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; transition: 0.3s; }
        .chapter-item:hover { border-color: rgba(56,189,248,0.3); }
        .chapter-item.completed { background: rgba(74,222,128,0.05); border-color: rgba(74,222,128,0.2); }
        .chapter-item .ch-info { display: flex; align-items: center; gap: 12px; }
        .chapter-item .ch-num { background: rgba(56,189,248,0.1); color: #38bdf8; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
        .chapter-item.completed .ch-num { background: rgba(74,222,128,0.15); color: #4ade80; }
        .chapter-item .ch-title { color: #eef2f6; font-weight: 500; }
        .chapter-item .ch-status { font-size: 12px; color: #64748b; }
        .chapter-item.completed .ch-status { color: #4ade80; }
        .chapter-item .ch-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .chapter-item .ch-actions button { padding: 7px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.25s; }
        .btn-notes-action { background: rgba(56,189,248,0.1); color: #38bdf8; }
        .btn-notes-action:hover { background: rgba(56,189,248,0.2); }
        .btn-complete { background: rgba(74,222,128,0.1); color: #4ade80; }
        .btn-complete:hover { background: rgba(74,222,128,0.2); transform: scale(1.04); }
        .btn-undo { background: rgba(239,68,68,0.1); color: #ef4444; }
        .btn-undo:hover { background: rgba(239,68,68,0.2); transform: scale(1.04); }
        .notes-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; }
        .notes-overlay.active { display: flex; }
        .notes-popup { background: #1a2236; border: 1px solid rgba(56,189,248,0.2); border-radius: 24px; padding: 35px 40px; max-width: 600px; width: 92%; max-height: 80vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0,0,0,0.6); animation: popUp 0.3s ease; }
        @keyframes popUp { from { transform: scale(0.9) translateY(20px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        .notes-popup .popup-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #1e2e47; }
        .notes-popup .popup-header h2 { color: #f0f9ff; font-size: 1.3rem; font-weight: 600; }
        .notes-popup .popup-header h2 i { color: #38bdf8; margin-right: 10px; }
        .notes-popup .popup-close { background: rgba(239,68,68,0.1); border: none; color: #ef4444; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; transition: 0.2s; }
        .notes-popup .popup-close:hover { background: rgba(239,68,68,0.2); }
        .notes-popup .popup-content { color: #b0c4de; line-height: 1.8; font-size: 0.95rem; white-space: pre-wrap; }
        .notes-popup .popup-content strong { color: #f0f9ff; }
        .notes-popup .popup-content ul { list-style: none; padding-left: 10px; }
        .notes-popup .popup-content ul li { padding: 4px 0; padding-left: 20px; position: relative; }
        .notes-popup .popup-content ul li::before { content: '▸'; color: #38bdf8; position: absolute; left: 0; }
        .cert-section { margin-top: 24px; text-align: center; padding: 20px; background: rgba(251,191,36,0.05); border: 1px solid rgba(251,191,36,0.2); border-radius: 14px; display: none; }
        .cert-section p { color: #fbbf24; font-weight: 600; font-size: 1.1rem; }
        .cert-btn { margin-top: 10px; background: linear-gradient(135deg, #fbbf24, #f59e0b); border: none; color: #0b1120; padding: 12px 28px; border-radius: 30px; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 0.95rem; }
        .cert-btn:hover { transform: scale(1.04); box-shadow: 0 4px 20px rgba(251,191,36,0.3); }
        .footer-note { margin-top: 30px; text-align: right; font-size: 0.75rem; color: #3b5270; border-top: 1px solid #1a2a3f; padding-top: 16px; }
        .footer-note i { margin-right: 6px; }
        .notes-popup::-webkit-scrollbar { width: 4px; }
        .notes-popup::-webkit-scrollbar-track { background: transparent; }
        .notes-popup::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
        @media (max-width: 700px) { body { padding: 16px; } .notes-header { padding: 18px 20px; flex-wrap: wrap; } .notes-header h1 { font-size: 1.4rem; } .notes-header .icon { font-size: 2.5rem; } .notes-popup { padding: 24px 20px; } .chapter-item { padding: 14px 16px; } }
        @media (max-width: 480px) { .chapter-item .ch-actions button { font-size: 11px; padding: 5px 12px; } .notes-popup .popup-content { font-size: 0.85rem; } }
    </style>
</head>
<body>
    <div class="notes-container">
        <button class="back-btn" onclick="window.close()"><i class="fas fa-times"></i> Close Notes</button>

        <div class="notes-header">
            <div class="icon">📜</div>
            <div><h1>JavaScript</h1><div class="subtitle">Interactive Web Development</div></div>
        </div>

        <div class="progress-section">
            <div class="progress-top"><span><i class="fas fa-calendar"></i> Enrolled: <span id="enrolledDate">2026-08-05</span></span><span id="progressLabel">Progress: 0%</span></div>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
            <div class="progress-text"><span id="chaptersDone">0/5 chapters completed</span><span id="progressPercent">0%</span></div>
        </div>

        <h3 class="chapters-title"><i class="fas fa-list"></i> Chapters &amp; Notes</h3>
        <div id="chaptersList"></div>

        <div class="cert-section" id="certSection"><p>🎉 Course Completed!</p><button class="cert-btn" onclick="getCertificate()">📄 Get Certificate</button></div>
        <div class="footer-note"><i class="fas fa-sync-alt"></i> Updated: Today · 2:30 PM</div>
    </div>

    <div class="notes-overlay" id="notesPopup">
        <div class="notes-popup">
            <div class="popup-header"><h2><i class="fas fa-book"></i> <span id="popupTitle">Chapter Notes</span></h2><button class="popup-close" onclick="closeNotesPopup()"><i class="fas fa-times"></i></button></div>
            <div class="popup-content" id="popupContent"></div>
        </div>
    </div>

    <script>
        const chapterTitles = ['JS Basics', 'Functions & Scope', 'DOM Manipulation', 'Events & Callbacks', 'ES6+ Features'];
        let chapterStatus = [false, false, false, false, false];
        const notesData = [
            '<strong>📘 JS Basics</strong>\n\nJavaScript is a programming language for the web. It adds interactivity to websites.\n\n<strong>🔹 Variables:</strong>\nlet x = 5;\nconst y = 10;\nvar z = 15;\n\n<strong>🔹 Data Types:</strong>\n• String\n• Number\n• Boolean\n• Array\n• Object',
            '<strong>📘 Functions &amp; Scope</strong>\n\n<strong>🔹 Functions:</strong>\nfunction myFunction() {\n  // code\n}\n\n<strong>🔹 Arrow Functions:</strong>\nconst func = () => {\n  // code\n}\n\n<strong>🔹 Scope Types:</strong>\n• Global\n• Function\n• Block (let, const)',
            '<strong>📘 DOM Manipulation</strong>\n\nDOM = Document Object Model\n\n<strong>🔹 Select Elements:</strong>\ndocument.getElementById("id")\ndocument.querySelector(".class")\n\n<strong>🔹 Change Content:</strong>\nelement.textContent = "Hello"\nelement.innerHTML = "&lt;b&gt;Hello&lt;/b&gt;"\n\n<strong>🔹 Add/Remove Classes:</strong>\nelement.classList.add("active")\nelement.classList.remove("active")',
            '<strong>📘 Events &amp; Callbacks</strong>\n\n<strong>🔹 Common Events:</strong>\n• click\n• mouseover\n• keydown\n• submit\n\n<strong>🔹 Event Listener:</strong>\nelement.addEventListener("click", function() {\n  // code\n});',
            '<strong>📘 ES6+ Features</strong>\n\n<strong>🔹 Arrow Functions:</strong>\n() => {}\n\n<strong>🔹 Template Literals:</strong>\n`Hello ${name}`\n\n<strong>🔹 Destructuring:</strong>\nconst {name, age} = person;\n\n<strong>🔹 Spread Operator:</strong>\n[...array]\n\n<strong>🔹 Classes:</strong>\nclass Person {\n  constructor(name) {\n    this.name = name;\n  }\n}'
        ];

        function renderChapters() {
            const container = document.getElementById('chaptersList');
            let html = '';
            for (let i = 0; i < chapterTitles.length; i++) {
                const isCompleted = chapterStatus[i];
                html += `
                    <div class="chapter-item ${isCompleted ? 'completed' : ''}">
                        <div class="ch-info"><div class="ch-num">${i+1}</div><div><div class="ch-title">${chapterTitles[i]}</div><div class="ch-status">${isCompleted ? '✅ Completed' : '⏳ Not completed'}</div></div></div>
                        <div class="ch-actions">
                            <button class="btn-notes-action" onclick="openNotesPopup(${i})"><i class="fas fa-book"></i> Notes</button>
                            ${isCompleted ? `<button class="btn-undo" onclick="toggleChapter(${i})"><i class="fas fa-undo"></i> Undo</button>` : `<button class="btn-complete" onclick="toggleChapter(${i})"><i class="fas fa-check"></i> Complete</button>`}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            updateProgress();
        }

        function toggleChapter(index) {
            chapterStatus[index] = !chapterStatus[index];
            renderChapters();
            if (window.opener && window.opener.toggleChapterCompleteFromNotes) {
                window.opener.toggleChapterCompleteFromNotes('JavaScript', index);
            }
        }

        function openNotesPopup(index) {
            const popup = document.getElementById('notesPopup');
            document.getElementById('popupTitle').textContent = 'Chapter ' + (index+1) + ': ' + chapterTitles[index];
            document.getElementById('popupContent').innerHTML = notesData[index] || '📘 Notes not available.';
            popup.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeNotesPopup() {
            document.getElementById('notesPopup').classList.remove('active');
            document.body.style.overflow = 'auto';
        }
        document.getElementById('notesPopup').addEventListener('click', function(e) { if (e.target === this) closeNotesPopup(); });
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeNotesPopup(); });

        function updateProgress() {
            const completed = chapterStatus.filter(c => c).length;
            const total = chapterStatus.length;
            const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('chaptersDone').textContent = completed + '/' + total + ' chapters completed';
            document.getElementById('progressPercent').textContent = progress + '%';
            document.getElementById('progressLabel').textContent = 'Progress: ' + progress + '%';
            document.getElementById('certSection').style.display = progress === 100 ? 'block' : 'none';
        }

        function getCertificate() {
            if (confirm('🎓 Generate Certificate for JavaScript?')) {
                alert('📄 Certificate downloaded successfully!');
                if (window.opener && window.opener.showCertificate) window.opener.showCertificate('JavaScript');
                window.close();
            }
        }
        renderChapters();
    </script>
</body>
</html>
