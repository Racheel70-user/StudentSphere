<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Stud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Forgot-password.css">
</head>
<body>
<div class="forgot-page">
    <div class="right-section">
        <div class="forgot-card">
            <h1>Forgot Password?</h1>
            <p class="description">Enter your registered email address and we’ll check whether it exists in the database before sending a reset link.</p>
            <div class="input-box">
                <span class="user-icon">✉</span>
                <input type="email" id="email" placeholder="Enter your Gmail address" autocomplete="email" maxlength="254">
            </div>
            <button type="button" class="reset-btn" onclick="resetPassword()">Send Reset Link</button>
            <div class="or-section"><span></span><p>or</p><span></span></div>
            <a href="index.html" class="back-login">Back to Login</a>
        </div>
    </div>
</div>

<script>
async function resetPassword() {
    const email = document.getElementById("email").value.trim().toLowerCase();

    if (!email) {
        alert("Please enter your Gmail address.");
        return;
    }

    if (!/^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email)) {
        alert("Please enter a valid Gmail address ending with @gmail.com.");
        return;
    }

    try {
        const response = await fetch("/api/auth/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "User not registered.");
            return;
        }

        alert(data.message || "Password reset link has been sent.");
    } catch (error) {
        alert("Unable to reach the server right now.");
    }
}
</script>
</body>
</html>
