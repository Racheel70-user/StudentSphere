<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stud Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="login-page">
    <div class="background"></div>
    <section class="login-card" aria-label="Login">
        <h1>Welcome back</h1>

        <div class="role-switch" role="group" aria-label="Login role">
            <span class="role-label active" id="studentLabel">Student</span>
            <button type="button" class="switch" id="roleSwitch" aria-pressed="false" aria-label="Toggle student or faculty"></button>
            <span class="role-label" id="facultyLabel">Faculty</span>
            <input type="hidden" id="role" value="student">
        </div>

        <form id="loginForm" class="login-form">
            <div class="input-box">
                <span class="icon">ID</span>
                <input type="text" id="username" placeholder="Student ID" autocomplete="username">
            </div>

            <div class="input-box">
                <span class="icon">◫</span>
                <input type="password" id="password" placeholder="Password" autocomplete="current-password">
                <button type="button" class="eye" id="passwordToggle" aria-label="Show password">
                    <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 5c5.5 0 9.7 4 11 7-1.3 3-5.5 7-11 7S2.3 15 1 12c1.3-3 5.5-7 11-7Zm0 2C7.9 7 4.6 9.8 3.2 12 4.6 14.2 7.9 17 12 17s7.4-2.8 8.8-5C19.4 9.8 16.1 7 12 7Zm0 1.5A3.5 3.5 0 1 1 12 16a3.5 3.5 0 0 1 0-7Z"/>
                    </svg>
                    <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3.3 2.7 18 18-1.4 1.4-3.1-3.1A11.8 11.8 0 0 1 12 19c-5.5 0-9.7-4-11-7a15.5 15.5 0 0 1 4-4.9L1.9 4.1 3.3 2.7Zm8.7 4.8A3.5 3.5 0 0 1 15.5 13l-5.8-5.8A3.4 3.4 0 0 1 12 7.5Zm0-2C7.9 5.5 4.6 8.3 3.2 10.5c.5.8 1.3 1.7 2.3 2.5l1.6-1.6A3.5 3.5 0 0 1 9 8.8l1.6-1.6c.5-.1 1-.2 1.4-.2Zm0 13c4.1 0 7.4-2.8 8.8-5-.7-1.1-1.8-2.4-3.4-3.5l-1.5 1.5A3.5 3.5 0 0 1 13 15.8l-1.8 1.8c.3 0 .5.1.8.1Z"/>
                    </svg>
                </button>
            </div>

            <div class="options">
                <label class="remember-wrap">
                    <input type="checkbox" id="rememberMe">
                    <span>Remember me</span>
                </label>
                <a href="forgot-password.html">Forgot Password?</a>
            </div>

            <button class="login-btn" type="submit">Login</button>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </p>
    </section>
</main>

<script>
const roleSwitch = document.getElementById("roleSwitch");
const roleInput = document.getElementById("role");
const username = document.getElementById("username");
const studentLabel = document.getElementById("studentLabel");
const facultyLabel = document.getElementById("facultyLabel");
const passwordToggle = document.getElementById("passwordToggle");
const password = document.getElementById("password");
const loginForm = document.getElementById("loginForm");
const rememberMe = document.getElementById("rememberMe");
const apiBase = "http://127.0.0.1:3000";

const modes = {
    student: {
        label: "Student",
        placeholder: "Student ID",
        endpoint: `${apiBase}/api/auth/student-login`,
        redirect: "/student-dashboard/index.html"
    },
    faculty: {
        label: "Faculty",
        placeholder: "Faculty ID",
        endpoint: `${apiBase}/api/auth/faculty-login`,
        redirect: "/faculty/index.html"
    }
};

function setRole(role) {
    roleInput.value = role;
    roleSwitch.setAttribute("aria-pressed", role === "faculty" ? "true" : "false");
    username.placeholder = modes[role].placeholder;
    studentLabel.classList.toggle("active", role === "student");
    facultyLabel.classList.toggle("active", role === "faculty");
    roleSwitch.classList.toggle("faculty", role === "faculty");
}

roleSwitch.addEventListener("click", () => {
    setRole(roleInput.value === "student" ? "faculty" : "student");
});

passwordToggle.addEventListener("click", () => {
    const hidden = password.type === "password";
    password.type = hidden ? "text" : "password";
    passwordToggle.classList.toggle("is-visible", hidden);
    passwordToggle.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
});

loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();

    const role = roleInput.value;
    const config = modes[role];
    const identifier = username.value.trim();
    const secret = password.value.trim();

    if (!identifier || !secret) {
        alert(`Please enter ${config.label} ID and password.`);
        return;
    }

    try {
        const response = await fetch(config.endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                username: identifier,
                password: secret
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.message || "Login failed.");
            return;
        }

        sessionStorage.setItem("studSession", JSON.stringify(data.session));
        if (document.getElementById("rememberMe").checked) {
            localStorage.setItem("studSession", JSON.stringify(data.session));
        } else {
            localStorage.removeItem("studSession");
        }
        window.location.href = config.redirect;
    } catch (error) {
        alert("Unable to reach the server right now.");
    }
});

setRole("student");
</script>
</body>
</html>
