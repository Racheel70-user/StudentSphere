<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudentSphere - Fees</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body data-page-role="student">
<div class="app-shell">
    <header class="portal-topbar">
        <div class="portal-title">
            <div class="brand fee-brand">
                <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span>
                <span>StudentSphere</span>
            </div>
        </div>
        <div class="portal-actions">
            <div class="top-profile" onclick="toggleProfilePopupRight()">
                <div class="avatar" id="topAvatar">A</div>
                <div class="info"><span class="name" id="topName">Student</span><span class="role" id="topRole">Student</span></div>
                <i class="fas fa-chevron-down" id="profileArrowRight"></i>
                <div class="profile-popup-right" id="profilePopupRight">
                    <div class="popup-item" onclick="showProfilePage()"><i class="fas fa-user"></i>My Profile</div>
                    <div class="divider"></div>
                    <div class="popup-item logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i>Logout</div>
                </div>
            </div>
        </div>
    </header>
    <main class="portal-main">
        <section class="page active">
            <div id="studentDetails"></div>
        </section>
    </main>
</div>
<div id="popup" class="popup"><div class="popup-content"><span class="close" onclick="closePopup()">&times;</span><div id="popupData"></div></div></div>
<script src="/shared/stud-api.js"></script><script src="data.js"></script><script src="student.js"></script><script src="script.js"></script>
</body>
</html>
