    <script src="faculty-auth.js"></script>

    <script>
        fillFaculty();

        var allStudents = [];
        var tbody = document.getElementById("studentRows");
        var classFilter = document.getElementById("classFilter");

        function statusClass(status) {
            return status === "Present"
                ? "present"
                : status === "Absent"
                    ? "absent"
                    : "pending";
        }

        function rowHtml(student) {

            var name = "s" + student.id; // unique radio group name
            var roll = student.class + "-" + String(student.id).padStart(3, "0");

            return (
                '<tr data-row data-name="' + student.name + '">' +
                    '<td>' + student.name + '</td>' +
                    '<td>' + roll + '</td>' +
                    '<td>' +
                        '<div class="mark-options">' +
                            '<input id="' + name + '-present" type="radio" name="' + name + '" data-status="Present" checked>' +
                            '<label for="' + name + '-present">✓</label>' +

                            '<input id="' + name + '-absent" type="radio" name="' + name + '" data-status="Absent">' +
                            '<label for="' + name + '-absent">✕</label>' +

                            '<input id="' + name + '-unmarked" type="radio" name="' + name + '" data-status="Not marked">' +
                            '<label for="' + name + '-unmarked">—</label>' +
                        '</div>' +
                    '</td>' +
                    '<td><span class="status status-text present">Present</span></td>' +
                '</tr>'
            );
        }

        function renderStudents(classValue) {

            var filtered = classValue === "all"
                ? allStudents
                : allStudents.filter(function (s) { return s.class === classValue; });

            if (!filtered.length) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding:18px 0;color:#94a3b8;">No students found for this class.</td></tr>';
                return;
            }

            tbody.innerHTML = filtered.map(rowHtml).join("");
        }

        function populateClassFilter() {

            var classes = Array.from(new Set(allStudents.map(function (s) { return s.class; })))
                .sort();

            classes.forEach(function (c) {
                var opt = document.createElement("option");
                opt.value = c;
                opt.textContent = "Class " + c;
                classFilter.appendChild(opt);
            });
        }

        fetch("users_with_class.json")
            .then(function (res) { return res.json(); })
            .then(function (data) {
                allStudents = data;
                populateClassFilter();
                renderStudents("all");
            })
            .catch(function (err) {
                tbody.innerHTML = '<tr><td colspan="4" style="padding:18px 0;color:#fb7185;">Could not load student data.</td></tr>';
                console.error("Failed to load students:", err);
            });

        classFilter.addEventListener("change", function () {
            renderStudents(this.value);
        });

      
        tbody.addEventListener("change", function (e) {

            if (!e.target.matches(".mark-options input")) return;

            var badge = e.target.closest("[data-row]").querySelector(".status-text");
            var status = e.target.dataset.status;

            badge.textContent = status;
            badge.className = "status status-text " + statusClass(status);
        });

        function message() {

            var saveBtn = document.getElementById("save");
            var msg = document.getElementById("msg");

            msg.style.display = "block";

            saveBtn.textContent = "Attendance Saved ✓";

            setTimeout(function () {
                saveBtn.textContent = "Save Attendance";
                msg.style.display = "none";
            }, 1800);
        }
    </script>
